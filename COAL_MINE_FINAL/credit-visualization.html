<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Visualization</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1c1e26;
            color: #fff;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .image-container {
            /* background-color: #383c47; */
            border-radius: 10px;
            padding: 10px;
            text-align: center;
        }

        .image-container img {
            max-width: 100%;
            height: auto;
            border-radius: 5px;
        }

        .image-container p {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Data Visualization</h1>
    <div class="image-grid">
        <div class="image-container">
            <img src="WhatsApp Image 2024-09-17 at 22.52.31_60f63dc4.jpg" alt="Data Visualization 1">
            <!-- <p>Carbon Emissions by Sector</p> -->
        </div>
        <div class="image-container">
            <img src="WhatsApp Image 2024-09-17 at 22.52.48_81c3534a.jpg" alt="Data Visualization 2">
            
        </div>
        <div class="image-container">
            <img src="WhatsApp Image 2024-09-17 at 22.53.27_2196cf7f.jpg" alt="Data Visualization 3">
            
        </div>
        <div class="image-container">
            <img src="Screenshot (79).png" alt="Data Visualization 4">
            
        </div>
    </div>
</body>
</html>
